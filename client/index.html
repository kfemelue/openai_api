<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>TasteBuddy</title>
</head>
<body>
    <main>
        <header id="header">
            <h1>TasteBuddy</h1>
            <img id="header-image" src="./Gemini_Generated_Image_710zde710zde710z.jpeg" alt="A graphic of a Nigerian Jollof Rice and Chicken Dish">
        </header>
        <section>
            <p>TasteBuddy is a helpful AI chatbot assistant that helps you to find restaurants in your area</p>
        </section>
        <section id="chat-container">
            <div id="chat-box">
        
            </div>
            <div id="input-container">
                <textarea id="user-input" required placeholder="Try asking for a restaurant recommendation in your city" name="user-prompt" id="user-prompt"></textarea>
            </div>
            <button id="ask-button" onclick="askAssistant()"> Ask </button>
        </section>
    </main>
    <script src="./script.js"></script>
</body>
</html>
